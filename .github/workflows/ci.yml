name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents encore en cours sur la même branche/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Valeurs factices : aucun secret réel n'est nécessaire pour compiler/tester.
# Les clients Supabase sont paresseux (appelés à la requête, pas au build).
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: https://valid-job-solutions.example

jobs:
  # ── Qualité (parallèles : aucune dépendance entre eux) ──────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests unitaires + intégration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tests unitaires (couverture, seuil 60 %)
        run: npm run test:unit
      - name: Tests d'intégration (routes API)
        run: npm run test:integration

  # ── Sécurité (parallèle, n'attend rien) ─────────────────────────────
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Échoue uniquement sur high/critical ; low/moderate = avertissement.
      - run: npm audit --audit-level=high

  semgrep:
    name: SAST (Semgrep p/ci)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # --severity ERROR : ne bloque que les findings graves (le reste = info).
      - run: semgrep scan --config p/ci --severity ERROR --error

  # ── Build réel (après la qualité : inutile de compiler du code cassé) ─
  build:
    name: Build production + budget bundle
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (next build)
        run: npm run build
      - name: Budget de taille du bundle (souple — avertit seulement)
        run: node scripts/check-bundle-size.mjs

  # ── E2E contre le build local (autonome : aucun secret requis) ──────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
