name: Deploy Production (Vercel)

# Déploiement PRODUCTION au merge sur main, derrière une APPROBATION MANUELLE :
# l'environnement GitHub « production » doit être configuré avec des
# « Required reviewers » (Settings → Environments → production).
# Après le déploiement : tests de fumée contre l'URL live ; en cas d'échec,
# une issue GitHub est ouverte automatiquement.
# Secrets requis : VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  push:
    branches: [main]

# Les déploiements prod se suivent, jamais en parallèle (pas d'annulation).
concurrency:
  group: production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    name: Déployer en production
    runs-on: ubuntu-latest
    # L'approbation manuelle est portée par cet environnement GitHub.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Vérifier la présence des secrets Vercel
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Secrets Vercel absents — déploiement production sauté."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer Vercel CLI
        if: steps.gate.outputs.skip != 'true'
        run: npm install -g vercel@latest

      - name: Récupérer la config Vercel (production)
        if: steps.gate.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel (production)
        if: steps.gate.outputs.skip != 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer (production)
        if: steps.gate.outputs.skip != 'true'
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Production déployée : $url"

  smoke:
    name: Tests de fumée post-déploiement
    runs-on: ubuntu-latest
    needs: deploy-production
    if: needs.deploy-production.outputs.url != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Smoke tests contre la production
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.deploy-production.outputs.url }}
        run: npm run test:smoke

  alert-on-failure:
    name: Alerte si la fumée échoue
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke]
    if: failure() && needs.deploy-production.outputs.url != ''
    permissions:
      issues: write
    steps:
      - name: Ouvrir une issue GitHub
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Échec des tests de fumée post-déploiement (${new Date().toISOString()})`,
              labels: ['production', 'incident'],
              body: [
                'Les tests de fumée ont échoué après un déploiement production.',
                '',
                `- **Commit** : ${context.sha}`,
                `- **Run** : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Vérifier immédiatement le site et envisager un rollback via le dashboard Vercel (Deployments → Promote previous).',
              ].join('\n'),
            });
