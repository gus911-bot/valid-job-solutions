# Mises à jour automatiques des dépendances (PRs hebdomadaires).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Regroupe les bumps mineurs/patch en une seule PR (moins de bruit).
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
